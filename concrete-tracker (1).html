<style>
  :root{
    --bg: #edece7;
    --paper: #fbfaf7;
    --ink: #1c1e1b;
    --ink-soft: #5c5f59;
    --line: #d3d1c8;
    --line-strong: #b8b6ac;
    --orange: #d9541f;
    --orange-soft: rgba(217,84,31,0.10);
    --blue: #2f4d6b;
    --green: #3f6b4a;
    --radius: 6px;
    --font-th: 'IBM Plex Sans Thai', -apple-system, sans-serif;
    --font-num: 'JetBrains Mono', ui-monospace, monospace;
  }
  :root[data-theme="dark"]{
    --bg: #17181a;
    --paper: #1f2123;
    --ink: #ece9e2;
    --ink-soft: #97968f;
    --line: #34362f;
    --line-strong: #46483f;
    --orange: #e77a44;
    --orange-soft: rgba(231,122,68,0.14);
    --blue: #7ea2c4;
    --green: #7fae8c;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 100% 34px,
      var(--bg);
    color: var(--ink);
    font-family: var(--font-th);
    min-height:100vh;
    padding-bottom: 90px;
  }
  input, select, button, textarea{ font-family: inherit; }

  .topbar{
    background: var(--paper);
    border-bottom: 1px solid var(--line-strong);
    padding: 16px 16px 0;
    position: sticky; top:0; z-index: 5;
  }
  .topbar-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;}
  .title{ font-size: 17px; font-weight:700; line-height:1.3; }
  .title small{ display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .theme-toggle{
    border:1px solid var(--line-strong); background: var(--bg); color: var(--ink);
    border-radius: 50%; width:32px; height:32px; font-size:14px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }

  .tabs{ display:flex; gap: 2px; }
  .tab{
    flex:1; text-align:center; padding: 10px 4px; font-size: 13px; font-weight:600;
    color: var(--ink-soft); border-bottom: 2px solid transparent; cursor:pointer;
  }
  .tab.active{ color: var(--orange); border-bottom-color: var(--orange); }

  .wrap{ max-width: 560px; margin:0 auto; padding: 18px 16px 0; }
  .view{ display:none; }
  .view.active{ display:block; }

  /* --- summary --- */
  .stat-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom: 18px; }
  .stat{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 10px;
  }
  .stat .num{ font-family: var(--font-num); font-size: 19px; font-weight:700; line-height:1.1; }
  .stat .lbl{ font-size: 11px; color: var(--ink-soft); margin-top:4px; }
  .stat.remain .num{ color: var(--orange); }
  .stat.used .num{ color: var(--green); }

  .item-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 14px; margin-bottom: 10px;
  }
  .item-card-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:8px; }
  .item-name{ font-weight:600; font-size:14.5px; }
  .item-pct{ font-family: var(--font-num); font-size:12.5px; color: var(--ink-soft); flex:0 0 auto; }
  .bar{ height:6px; background: var(--line); border-radius:4px; overflow:hidden; margin-bottom:8px; }
  .bar-fill{ height:100%; background: var(--green); border-radius:4px; transition: width .3s ease; }
  .bar-fill.over{ background: var(--orange); }
  .item-nums{ display:flex; justify-content:space-between; font-family: var(--font-num); font-size:12px; color: var(--ink-soft); }
  .item-nums b{ color: var(--ink); font-weight:600; }

  .empty{ text-align:center; padding: 40px 20px; color: var(--ink-soft); font-size: 13.5px; line-height:1.7; }

  /* --- form --- */
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:12.5px; color: var(--ink-soft); margin-bottom:5px; font-weight:500; }
  .field input, .field select, .field textarea{
    width:100%; padding: 11px 12px; border:1px solid var(--line-strong); border-radius: var(--radius);
    background: var(--paper); color: var(--ink); font-size:15px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--orange); outline-offset:-1px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .btn{
    width:100%; padding: 13px; border-radius: var(--radius); border:none;
    background: var(--orange); color:#fff; font-size:15px; font-weight:700; cursor:pointer;
    margin-top: 4px;
  }
  .btn:active{ opacity:.85; }
  .btn-outline{
    background: transparent; color: var(--ink); border:1px solid var(--line-strong); font-weight:600;
  }
  .form-card{
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius); padding:16px; margin-bottom:18px;
  }
  .form-card h3{ margin:0 0 14px; font-size:14.5px; }

  /* --- log table --- */
  .log-group-label{ font-size:12px; color: var(--ink-soft); font-weight:600; margin: 18px 0 8px; }
  .log-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 11px 12px; margin-bottom:8px;
  }
  .log-row-main{ min-width:0; }
  .log-row-item{ font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log-row-meta{ font-size:11.5px; color: var(--ink-soft); margin-top:2px; }
  .log-row-qty{ font-family: var(--font-num); font-weight:700; font-size:14.5px; flex:0 0 auto; text-align:right; }
  .log-row-qty span{ display:block; font-size:10.5px; color: var(--ink-soft); font-weight:400; font-family: var(--font-th); }
  .del-btn{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%; border:1px solid var(--line-strong);
    background:transparent; color: var(--ink-soft); font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }

  .list-item-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background: var(--paper); border:1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom:8px;
  }
  .list-item-row .n{ font-size:14px; font-weight:600; }
  .list-item-row .q{ font-family: var(--font-num); font-size:12.5px; color: var(--ink-soft); margin-top:2px; }

  .section-gap{ height: 4px; }
  a.reset-link{ display:block; text-align:center; font-size:12px; color: var(--ink-soft); margin: 24px 0 10px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap" style="padding:0;">
    <div class="topbar-row">
      <div class="title">Concrete Tracking<small>บันทึกงานเทคอนกรีต เทียบยอดใช้จริงกับ BOQ</small></div>
      <button class="theme-toggle" id="themeToggle">◐</button>
    </div>
    <div class="tabs">
      <div class="tab active" data-view="summary">สรุป</div>
      <div class="tab" data-view="log">บันทึกงานเท</div>
      <div class="tab" data-view="boq">ตั้งค่า BOQ</div>
    </div>
  </div>
</div>

<div class="wrap">

  <!-- SUMMARY VIEW -->
  <div class="view active" id="view-summary">
    <div class="stat-grid" id="statGrid"></div>
    <div id="itemCards"></div>
  </div>

  <!-- LOG VIEW -->
  <div class="view" id="view-log">
    <div class="form-card">
      <h3>เพิ่มบันทึกงานเท</h3>
      <div class="field">
        <label>รายการงาน (BOQ)</label>
        <select id="logItemSelect"></select>
      </div>
      <div class="field-row">
        <div class="field">
          <label>วันที่เท</label>
          <input type="date" id="logDate">
        </div>
        <div class="field">
          <label>ปริมาณที่เท (ลบ.ม.)</label>
          <input type="number" id="logQty" step="0.01" placeholder="0.00">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>จำนวนโหลด (ไม่บังคับ)</label>
          <input type="number" id="logLoads" step="1" placeholder="เช่น 3">
        </div>
        <div class="field">
          <label>คิว/โหลด (ไม่บังคับ)</label>
          <input type="number" id="logPerLoad" step="0.01" placeholder="เช่น 6">
        </div>
      </div>
      <div class="field">
        <label>หมายเหตุ (ไม่บังคับ)</label>
        <input type="text" id="logNote" placeholder="เช่น ชั้น 3 พื้นห้อง A">
      </div>
      <button class="btn" id="addLogBtn">บันทึก</button>
    </div>
    <div id="logList"></div>
  </div>

  <!-- BOQ VIEW -->
  <div class="view" id="view-boq">
    <div class="form-card">
      <h3>เพิ่มรายการ BOQ</h3>
      <div class="field">
        <label>ชื่องาน</label>
        <input type="text" id="boqName" placeholder="เช่น เสา ชั้น 1">
      </div>
      <div class="field-row">
        <div class="field">
          <label>ปริมาณตาม BOQ (ลบ.ม.)</label>
          <input type="number" id="boqQty" step="0.01" placeholder="0.00">
        </div>
      </div>
      <button class="btn" id="addBoqBtn">เพิ่มรายการ</button>
    </div>
    <div id="boqList"></div>
    <a class="reset-link" id="resetAll">ล้างข้อมูลทั้งหมด</a>
  </div>

</div>

<script>
(function(){
  const STORE_KEY = 'concrete-tracker-v1';
  const THEME_KEY = 'concrete-tracker-theme-v1';
  let data = { boq: [], logs: [] };

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw) data = JSON.parse(raw);
    }catch(e){ data = { boq: [], logs: [] }; }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){}
  }
  function loadTheme(){
    try{
      if(localStorage.getItem(THEME_KEY) === 'dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function fmt(n){
    n = Number(n) || 0;
    return n.toLocaleString('th-TH', { maximumFractionDigits: 2, minimumFractionDigits: 0 });
  }
  function fmtDate(d){
    if(!d) return '-';
    const dt = new Date(d + 'T00:00:00');
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString('th-TH', { day:'2-digit', month:'short', year:'2-digit' });
  }

  // ---------- tabs ----------
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('view-' + tab.dataset.view).classList.add('active');
      if(tab.dataset.view === 'summary') renderSummary();
      if(tab.dataset.view === 'log') renderLog();
      if(tab.dataset.view === 'boq') renderBoq();
    });
  });

  document.getElementById('themeToggle').addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){ document.documentElement.removeAttribute('data-theme'); try{localStorage.setItem(THEME_KEY,'light');}catch(e){} }
    else{ document.documentElement.setAttribute('data-theme','dark'); try{localStorage.setItem(THEME_KEY,'dark');}catch(e){} }
  });

  // ---------- computed ----------
  function usedFor(itemId){
    return data.logs.filter(l => l.itemId === itemId).reduce((s,l)=> s + (Number(l.qty)||0), 0);
  }

  // ---------- SUMMARY ----------
  function renderSummary(){
    const totalBoq = data.boq.reduce((s,i)=> s + (Number(i.qty)||0), 0);
    const totalUsed = data.logs.reduce((s,l)=> s + (Number(l.qty)||0), 0);
    const totalRemain = totalBoq - totalUsed;

    document.getElementById('statGrid').innerHTML = `
      <div class="stat"><div class="num">${fmt(totalBoq)}</div><div class="lbl">BOQ ทั้งหมด (ลบ.ม.)</div></div>
      <div class="stat used"><div class="num">${fmt(totalUsed)}</div><div class="lbl">เทไปแล้ว</div></div>
      <div class="stat remain"><div class="num">${fmt(totalRemain)}</div><div class="lbl">คงเหลือ</div></div>
    `;

    const cardsEl = document.getElementById('itemCards');
    if(data.boq.length === 0){
      cardsEl.innerHTML = `<div class="empty">ยังไม่มีรายการ BOQ<br>ไปที่แท็บ "ตั้งค่า BOQ" เพื่อเพิ่มรายการงานก่อน</div>`;
      return;
    }
    cardsEl.innerHTML = data.boq.map(item => {
      const used = usedFor(item.id);
      const remain = (Number(item.qty)||0) - used;
      const pct = item.qty ? Math.min(100, (used/item.qty)*100) : 0;
      const over = used > item.qty;
      return `
        <div class="item-card">
          <div class="item-card-head">
            <div class="item-name">${escapeHtml(item.name)}</div>
            <div class="item-pct">${item.qty ? Math.round((used/item.qty)*100) : 0}%</div>
          </div>
          <div class="bar"><div class="bar-fill ${over?'over':''}" style="width:${pct}%"></div></div>
          <div class="item-nums">
            <span>ใช้ <b>${fmt(used)}</b></span>
            <span>เหลือ <b style="color:${over?'var(--orange)':'inherit'}">${fmt(remain)}</b></span>
            <span>BOQ <b>${fmt(item.qty)}</b></span>
          </div>
        </div>
      `;
    }).join('');
  }

  // ---------- LOG ----------
  function renderLogItemSelect(){
    const sel = document.getElementById('logItemSelect');
    if(data.boq.length === 0){
      sel.innerHTML = '<option value="">-- เพิ่มรายการ BOQ ก่อน --</option>';
      return;
    }
    sel.innerHTML = data.boq.map(i => `<option value="${i.id}">${escapeHtml(i.name)}</option>`).join('');
  }

  document.getElementById('logLoads').addEventListener('input', autoCalcQty);
  document.getElementById('logPerLoad').addEventListener('input', autoCalcQty);
  function autoCalcQty(){
    const loads = Number(document.getElementById('logLoads').value);
    const perLoad = Number(document.getElementById('logPerLoad').value);
    if(loads && perLoad){
      document.getElementById('logQty').value = (loads * perLoad).toFixed(2);
    }
  }

  document.getElementById('addLogBtn').addEventListener('click', () => {
    const itemId = document.getElementById('logItemSelect').value;
    const date = document.getElementById('logDate').value;
    const qty = Number(document.getElementById('logQty').value);
    const loads = document.getElementById('logLoads').value;
    const perLoad = document.getElementById('logPerLoad').value;
    const note = document.getElementById('logNote').value.trim();

    if(!itemId){ alert('กรุณาเพิ่มรายการ BOQ ก่อน'); return; }
    if(!date){ alert('กรุณาเลือกวันที่'); return; }
    if(!qty || qty <= 0){ alert('กรุณากรอกปริมาณที่เท'); return; }

    data.logs.push({ id: uid(), itemId, date, qty, loads: loads || null, perLoad: perLoad || null, note });
    save();

    document.getElementById('logQty').value = '';
    document.getElementById('logLoads').value = '';
    document.getElementById('logPerLoad').value = '';
    document.getElementById('logNote').value = '';

    renderLog();
  });

  function renderLog(){
    renderLogItemSelect();
    if(!document.getElementById('logDate').value){
      document.getElementById('logDate').value = new Date().toISOString().slice(0,10);
    }
    const listEl = document.getElementById('logList');
    if(data.logs.length === 0){
      listEl.innerHTML = `<div class="empty">ยังไม่มีบันทึกงานเท<br>กรอกฟอร์มด้านบนเพื่อเริ่มบันทึก</div>`;
      return;
    }
    const sorted = [...data.logs].sort((a,b)=> b.date.localeCompare(a.date));
    listEl.innerHTML = `<div class="log-group-label">ประวัติการเท (${sorted.length} รายการ)</div>` +
      sorted.map(l => {
        const item = data.boq.find(i => i.id === l.itemId);
        const itemName = item ? item.name : '(รายการถูกลบแล้ว)';
        const loadInfo = l.loads && l.perLoad ? `${l.loads} โหลด × ${l.perLoad}` : (l.note || '');
        return `
          <div class="log-row">
            <div class="log-row-main">
              <div class="log-row-item">${escapeHtml(itemName)}</div>
              <div class="log-row-meta">${fmtDate(l.date)}${loadInfo ? ' · ' + escapeHtml(loadInfo) : ''}</div>
            </div>
            <div class="log-row-qty">${fmt(l.qty)}<span>ลบ.ม.</span></div>
            <button class="del-btn" data-id="${l.id}" aria-label="ลบ">✕</button>
          </div>
        `;
      }).join('');

    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        data.logs = data.logs.filter(l => l.id !== btn.dataset.id);
        save();
        renderLog();
      });
    });
  }

  // ---------- BOQ ----------
  document.getElementById('addBoqBtn').addEventListener('click', () => {
    const name = document.getElementById('boqName').value.trim();
    const qty = Number(document.getElementById('boqQty').value);
    if(!name){ alert('กรุณากรอกชื่องาน'); return; }
    if(!qty || qty <= 0){ alert('กรุณากรอกปริมาณตาม BOQ'); return; }
    data.boq.push({ id: uid(), name, qty });
    save();
    document.getElementById('boqName').value = '';
    document.getElementById('boqQty').value = '';
    renderBoq();
  });

  function renderBoq(){
    const listEl = document.getElementById('boqList');
    if(data.boq.length === 0){
      listEl.innerHTML = `<div class="empty">ยังไม่มีรายการ BOQ<br>เพิ่มรายการงานและปริมาณตามสัญญาด้านบน</div>`;
      return;
    }
    listEl.innerHTML = data.boq.map(item => {
      const used = usedFor(item.id);
      return `
        <div class="list-item-row">
          <div>
            <div class="n">${escapeHtml(item.name)}</div>
            <div class="q">BOQ ${fmt(item.qty)} ลบ.ม. · ใช้ไป ${fmt(used)}</div>
          </div>
          <button class="del-btn" data-id="${item.id}" aria-label="ลบ">✕</button>
        </div>
      `;
    }).join('');
    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const hasLogs = data.logs.some(l => l.itemId === btn.dataset.id);
        if(hasLogs && !confirm('รายการนี้มีบันทึกงานเทอยู่ด้วย ลบทั้งหมดใช่ไหม?')) return;
        data.boq = data.boq.filter(i => i.id !== btn.dataset.id);
        data.logs = data.logs.filter(l => l.itemId !== btn.dataset.id);
        save();
        renderBoq();
      });
    });
  }

  document.getElementById('resetAll').addEventListener('click', () => {
    if(confirm('ล้างข้อมูล BOQ และบันทึกทั้งหมดใช่ไหม? ทำแล้วกู้คืนไม่ได้')){
      data = { boq: [], logs: [] };
      save();
      renderBoq(); renderLog(); renderSummary();
    }
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  loadTheme();
  load();
  renderSummary();
})();
</script>
</body>
</html>
